services:
  - type: web
    name: waterwatch-backend
    env: docker
    dockerfilePath: 10_Deployment_WaterWatch/02_backend_cloud/Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/dashboard/summary
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MINUTES
        value: 480
      - key: FRONTEND_ORIGIN
        value: https://waterwatch-v3.vercel.app
      - key: EVENT_SIMULATOR_ENABLED
        value: true

